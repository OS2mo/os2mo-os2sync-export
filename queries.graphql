query FindFKItsystem {
  itsystems(filter: {user_keys: ["FK-ORG-UUID", "FK-ORG UUID"]}) {
    objects {
      uuid
    }
  }
}

query FindPastITUser(
  $filter: ITUserFilter
  $start: DateTime = null
  $end: DateTime
) {
  itusers(filter: $filter) {
    objects {
      validities(start: $start, end: $end) {
        user_key
        external_id
        validity {
          to
        }
      }
    }
  }
}

query FindAllFKItusers(
  $cursor: Cursor = null
  $limit: int = 1000
) {
  itusers(
    filter: {itsystem: {user_keys: ["FK-ORG-UUID", "FK-ORG UUID"]}}
    cursor: $cursor
    limit: $limit
  ) {
    objects {
      current {
        external_id
      }
    }
    page_info {
      next_cursor
    }
  }
}

mutation CreateITUser(
  $external_id: String!
  $itsystem: UUID!
  $person: UUID!
  $user_key: String!
  $from: DateTime!
) {
  ituser_create(
    input: {
      validity: {from: $from}
      user_key: $user_key
      itsystem: $itsystem
      external_id: $external_id
      person: $person
    }
  ) {
    uuid
  }
}

mutation TerminateITUser($uuid: UUID!, $to: DateTime!) {
  ituser_terminate(input: {uuid: $uuid, to: $to}) {
    uuid
  }
}

mutation EventSend(
  $namespace: String!
  $routing_key: String!
  $subject: String!
) {
  event_send(
    input: {namespace: $namespace, routing_key: $routing_key, subject: $subject}
  )
}

