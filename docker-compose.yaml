services:
  init:
    image: magentaaps/os2mo-init:5
    environment:
      # Keycloak
      AUTH_SERVER: "http://keycloak:8080/auth"
      # OS2mo
      MO_URL: "http://mo:5000"
      CLIENT_ID: "dipex"
      CLIENT_SECRET: "603f1c82-d012-4d04-9382-dbe659c533fb"
    volumes:
      - type: bind
        source: ./init.config.yml
        target: /config/config.yml
        read_only: true

  os2sync_export:
    build:
      context: .
      # Full dependency set, needed for `docker compose run ... pytest`.
      target: dev
    env_file:
      - docker.env
    command: ["uvicorn", "--factory", "os2sync_export.main:create_app", "--host", "0.0.0.0", "--reload"]
    ports:
      - 127.0.0.1:8000:8000/tcp
    volumes:
      - ./os2sync_export:/app/os2sync_export
      - ./tests:/app/tests
    depends_on:
      - db

  db:
    # Requirement for running integration tests
    # Not used in the actual integration
    image: postgres:16
    environment:
      POSTGRES_USER: "fastramqpi"
      POSTGRES_PASSWORD: "fastramqpi"
      POSTGRES_DB: "fastramqpi"
    networks:
      - default

networks:
  default:
    external: true
    name: os2mo_default
